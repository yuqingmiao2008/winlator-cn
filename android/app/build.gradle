apply plugin: 'com.android.application'

android {
    compileSdk 34

    defaultConfig {
        applicationId 'com.winlator.cn'
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 29
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    ndkVersion '24.0.8215888'

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    // midihandler 以 CMake IMPORTED 目标方式链接 jniLibs 中的预编译库,
    // AGP 会同时从 jniLibs 与 CMake 产物打包同名 .so (内容完全相同,
    // IMPORTED_LOCATION 直接指向 jniLibs 文件), 用 pickFirsts 去重
    packagingOptions {
        pickFirsts += [
            'lib/arm64-v8a/libFLAC.so',
            'lib/arm64-v8a/libc++_shared.so',
            'lib/arm64-v8a/libfluidsynth.so',
            'lib/arm64-v8a/libfluidsynth-assetloader.so',
            'lib/arm64-v8a/libgio-2.0.so',
            'lib/arm64-v8a/libglib-2.0.so',
            'lib/arm64-v8a/libgmodule-2.0.so',
            'lib/arm64-v8a/libgobject-2.0.so',
            'lib/arm64-v8a/libgthread-2.0.so',
            'lib/arm64-v8a/libinstpatch-1.0.so',
            'lib/arm64-v8a/liboboe.so',
            'lib/arm64-v8a/libogg.so',
            'lib/arm64-v8a/libopus.so',
            'lib/arm64-v8a/libpcre.so',
            'lib/arm64-v8a/libpcreposix.so',
            'lib/arm64-v8a/libsndfile.so',
            'lib/arm64-v8a/libvorbis.so',
            'lib/arm64-v8a/libvorbisenc.so',
            'lib/arm64-v8a/libvorbisfile.so'
        ]
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
}
