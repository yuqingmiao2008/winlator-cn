name: Publish APK artifact to Release (云端转发)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "包含 APK 的 Actions run ID"
        required: true
      tag:
        description: "目标 Release 标签"
        required: true
      apk_name:
        description: "APK 目标文件名 (可选, 留空保持原名)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 下载指定 run 的全部 artifact (自动探测 APK)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh run download "${{ inputs.run_id }}" -R "$GITHUB_REPOSITORY" -D /tmp/apk
          APK=$(find /tmp/apk -name '*.apk' | head -1)
          test -n "$APK"
          ls -lh "$APK"

      - name: 生成 sha256 校验和
        run: |
          APK=$(find /tmp/apk -name '*.apk' | head -1)
          cd "$(dirname "$APK")"
          f=$(basename "$APK")
          NAME="${{ inputs.apk_name }}"
          if [ -n "$NAME" ] && [ "$NAME" != "$f" ]; then
            mv "$f" "$NAME"
            f="$NAME"
          fi
          sha256sum "$f" > "$f.sha256"
          cat "$f.sha256" | cut -c1-16

      - name: 创建草稿 Release 并上传 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/apk
          TAG="${{ inputs.tag }}"
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --draft \
              --title "构建 ${TAG#dev-}" -R "$GITHUB_REPOSITORY"
          fi
          gh release upload "$TAG" $(find . -name '*.apk' -o -name '*.sha256') \
            --clobber -R "$GITHUB_REPOSITORY"
          echo "== 发布结果 =="
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json tagName,isDraft,assets \
            --jq '{tag: .tagName, draft: .isDraft, assets: [.assets[] | {name, size}]}'
